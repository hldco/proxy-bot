name: Run V2ray Bot
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests jdatetime pytz
          
      - name: Run Bot
        run: python bot.py
        
      - name: Save sent configs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update sent configs file
